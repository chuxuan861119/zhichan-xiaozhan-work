[package]
name = "patent-cadcraft-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[features]
harmony-codec = ["cadcraft-dwg/wasm-codec"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cadcraft-codec"
path = "src/bin/codec.rs"

[dependencies]
cadcraft-engine = { path = "../../out-cadcraft-archive/storytold-cadcraft-00c7613/crates/engine" }
cadcraft-io = { path = "../../out-cadcraft-archive/storytold-cadcraft-00c7613/crates/io" }
cadcraft-dwg = { path = "../../out-cadcraft-archive/storytold-cadcraft-00c7613/crates/dwg" }
cadcraft-fonts = { path = "../../out-cadcraft-archive/storytold-cadcraft-00c7613/crates/fonts" }
serde_json = "=1.0.149"
wasm-bindgen = "=0.2.108"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Match the immutable upstream lockfile; keep MPL-2.0 library unmodified.
acadrust = "=0.6.3"

[profile.release]
opt-level = 2
