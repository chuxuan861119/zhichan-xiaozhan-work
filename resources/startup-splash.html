<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body, main { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      html { background: transparent; }
      body { border-radius: 12px; background: #fff; animation: surface-in 400ms ease-in-out; }
      body[data-motion="exit"] { animation: surface-out 400ms ease-in-out forwards; }
      @keyframes surface-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes surface-out { from { opacity: 1; } to { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { body, body[data-motion="exit"] { animation: none; } }
      main { background: url("./startup-splash-background.png") center / cover no-repeat; }
      .status {
        position: absolute;
        left: 10.1%;
        bottom: 14.5%;
        width: 42%;
        margin: 0;
        padding: 2px 10px 2px 0;
        border: 0;
        background: linear-gradient(90deg, rgba(255, 255, 255, .98) 0%, rgba(255, 255, 255, .88) 78%, rgba(255, 255, 255, 0) 100%);
        color: #314860;
        font: 500 15px / 1.5 "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
        opacity: 0;
        transition: opacity 400ms ease-in-out;
      }
      .status.is-visible { opacity: 1; }
    </style>
  </head>
  <body>
    <main><p id="status" class="status" role="status" aria-live="polite"></p></main>
    <script>
      window.setStartupStatus = (value) => {
        const status = document.getElementById("status");
        if (value !== "正在准备工作台") {
          status.textContent = value;
          status.classList.add("is-visible");
        } else {
          status.textContent = "";
          status.classList.remove("is-visible");
        }
      };
    </script>
  </body>
</html>
