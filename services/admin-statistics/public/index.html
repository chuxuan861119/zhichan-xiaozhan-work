<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>知产小栈 · 统一统计后台</title><link rel="stylesheet" href="/admin-statistics/app.css"><script src="/admin-statistics/app.js" defer></script></head>
<body><div id="auth" class="auth-shell" hidden><div class="auth-card"><div class="wordmark">知产小栈 <span>Console</span></div><h1 id="auth-title">管理员登录</h1><p id="auth-intro">网站访问、软件下载与软件使用统计。</p><form id="auth-form"><label id="token-label" hidden>初始化凭据<input id="token" type="password" autocomplete="off" spellcheck="false"></label><label>用户名<input id="username" autocomplete="username" required maxlength="40"></label><label>密码<input id="password" type="password" autocomplete="current-password" required maxlength="128"></label><label id="confirmation-label" hidden>确认密码<input id="confirmation" type="password" autocomplete="new-password" maxlength="128"></label><p id="auth-message" role="alert"></p><button class="primary" id="auth-submit">登录</button></form><p class="muted small">专属管理员入口 · HTTPS 加密连接</p><a href="/">返回品牌官网 ↗</a></div></div>
<div id="dashboard" hidden><aside><div class="wordmark">知产小栈<span>Console</span></div><p class="nav-label">统一统计后台</p><nav aria-label="统计导航"><button data-tab="overview" class="active">◈　总览</button><button data-tab="traffic">↗　网站访问</button><button data-tab="downloads">↓　软件下载</button><button data-tab="usage">◷　软件使用</button><button data-tab="sources">▤　数据与运行状态</button></nav><div class="aside-bottom"><a href="/" target="_blank" rel="noopener">访问品牌官网 ↗</a><button id="logout">退出登录</button></div></aside><main><header><div><p class="overline">知产小栈专利服务生态</p><h1 id="page-title">统计总览</h1></div><div class="account"><span class="dot"></span><span id="account-name">管理员</span><button id="mobile-logout" class="mobile-logout">退出</button></div></header><section class="controls" aria-label="统计时间范围"><div class="presets"><button data-days="1">今天</button><button data-days="7" class="selected">近 7 天</button><button data-days="30">近 30 天</button></div><label>开始<input type="date" id="from" required></label><label>结束<input type="date" id="to" required></label><button id="apply" class="primary">查询</button><button id="refresh">刷新</button><a id="export" class="button" href="/admin-statistics/api/export.csv">导出网站 CSV ↗</a></section><div class="status-line"><span id="freshness">正在读取数据…</span><span>北京时间 UTC+8</span></div><p id="notice" class="notice" role="status" hidden></p><div id="content" aria-live="polite"></div><footer>数据来源：本站 Nginx 日志与 Work 暂定与固定汇总日报。所有指标按各自口径展示。</footer></main></div></body></html>
