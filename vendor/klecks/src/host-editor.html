<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片编辑画布</title>
  <style>
    html,body,#canvas{width:100%;height:100%;margin:0;overflow:hidden}
    body{background:#e6e8eb;font:14px system-ui,sans-serif}
    #error{position:absolute;inset:0;display:grid;place-items:center;margin:0;padding:24px;color:#663333;background:#f8f9fa}
    #error[hidden]{display:none}
    #error[data-recoverable="true"]:not([hidden]){inset:auto 16px 16px;display:block;max-width:640px;margin:0 auto;padding:12px 16px;border:1px solid #ead4a4;border-radius:6px;color:#854d0e;background:#fffbeb;pointer-events:none}
  </style>
</head>
<body>
  <main id="canvas" aria-label="图片编辑区域"></main>
  <p id="error" role="alert" hidden></p>
  <script src="editor.js" defer></script>
</body>
</html>
